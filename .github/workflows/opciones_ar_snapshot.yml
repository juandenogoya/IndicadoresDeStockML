name: Opciones AR Snapshot (Greeks + PCR)

on:
  schedule:
    # ── Snapshot 1: mid-session — 13:30 ART = 16:30 UTC ──────────────────────
    # Captura IV y Greeks en horario punta de actividad.
    - cron: '30 16 * * 1-5'
    # ── Snapshot 2: cierre — 16:45 ART = 19:45 UTC ───────────────────────────
    # Captura el volumen acumulado del dia completo (15 min antes del cierre).
    # Este snapshot es el clave para PCR y analisis de intenciones del mercado.
    - cron: '45 19 * * 1-5'
  workflow_dispatch:

jobs:
  opciones_ar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Snapshot opciones BCBA (Greeks + PCR)
        env:
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          IOL_USERNAME:   ${{ secrets.IOL_USERNAME }}
          IOL_PASSWORD:   ${{ secrets.IOL_PASSWORD }}
          PYTHONPATH:     ${{ github.workspace }}
        # --force: garantiza ejecucion aunque haya desfase de UTC.
        run: python scripts/38_opciones_ar_snapshot.py --force

      - name: Notificar fallo en Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>ERROR -- Opciones AR Snapshot</b>%0AWorkflow fallido.%0ARevisa: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
