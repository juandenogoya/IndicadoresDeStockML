name: Opciones Snapshot Diario

on:
  schedule:
    # Captura opciones EOD del mismo dia, despues del cierre del mercado NY.
    #
    # Ventana segura: 20:00-03:59 UTC (16:00-23:59 ET)
    #   - Mercado NY cierra: 20:00 UTC (16:00 ET)
    #   - Mantenimiento Yahoo empieza: ~04:00 UTC (00:00 ET)
    #   - Margen de ~7 horas sin riesgo de datos vacios
    #
    # Intento 1 — 21:00 UTC (17:00 ET)  L-V
    #   Con delay maximo observado de 3h -> corre hasta 00:00 UTC -> aun seguro
    # Intento 2 — 22:00 UTC (18:00 ET)  L-V
    #   Respaldo: corre 1 hora despues del intento 1
    #   Si intento 1 escribio datos -> detecta run redundante y termina OK
    #
    # --fecha usa la fecha DEL DIA (no yesterday) porque corremos el mismo dia del cierre.
    # Dia 1=Lunes ... 5=Viernes en cron UTC
    - cron: '0 21 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Permite ejecucion manual desde GitHub

jobs:
  opciones:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Snapshot opciones (calls/puts EOD)
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/33_opciones_snapshot.py --fecha $(date +%Y-%m-%d)
