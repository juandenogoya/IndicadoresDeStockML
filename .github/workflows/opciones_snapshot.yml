name: Opciones Snapshot Diario

on:
  schedule:
    # Dos intentos en ventana pre-apertura (mercado NY abre 13:30 UTC).
    # Ambos corren con --fecha yesterday capturando EOD del dia anterior.
    # Si el primero escribe datos, el segundo detecta "ya completo" y termina OK.
    # Si el primero falla o GH lo demora mucho, el segundo actua como respaldo.
    #
    # Intento 1 — 10:00 UTC (6 AM ET / 7 AM Argentina)
    #   Con delay maximo observado de 3h18m -> corre a las 13:18 UTC -> pre-apertura OK
    # Intento 2 — 11:00 UTC (8 AM Argentina / 7 AM ET)
    #   Respaldo: si intento 1 fallo o datos incompletos -> reintenta
    #   Con delay 2h -> 13:00 UTC -> aun pre-apertura OK
    #
    # EVITA ventana mantenimiento Yahoo (00:00-03:00 AM ET = 04:00-07:00 UTC)
    - cron: '0 10 * * 2-6'
    - cron: '0 11 * * 2-6'
  workflow_dispatch:  # Permite ejecucion manual desde GitHub

jobs:
  opciones:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Snapshot opciones (calls/puts EOD)
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/33_opciones_snapshot.py --fecha $(date -d 'yesterday' +%Y-%m-%d)
