name: Opciones Snapshot Diario

on:
  schedule:
    # Ma-Sa a la 01:00 UTC (10:00 PM ET / 11:00 PM Argentina)
    # Captura el cierre del dia anterior (L-V).
    # Corre 5 horas despues del cierre de opciones (4:15 PM ET = 20:15 UTC),
    # asegurando que yfinance haya publicado los datos de fin de dia.
    # El script recibe --fecha ayer para etiquetar correctamente el trading day.
    - cron: '0 1 * * 2-6'
  workflow_dispatch:  # Permite ejecucion manual desde GitHub

jobs:
  opciones:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Snapshot opciones (calls/puts EOD)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/33_opciones_snapshot.py --fecha $(date -d 'yesterday' +%Y-%m-%d)
