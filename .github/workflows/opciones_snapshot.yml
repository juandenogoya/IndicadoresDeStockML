name: Opciones Snapshot Diario

on:
  schedule:
    # L-V a las 22:00 UTC (6:00 PM ET / 7:00 PM Argentina)
    # Corre despues del cierre de NYSE (4:00 PM ET) y del mercado de opciones (4:15 PM ET).
    # 1 hora de margen extra por si en el futuro se extienden horarios de cotizacion.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Permite ejecucion manual desde GitHub

jobs:
  opciones:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Snapshot opciones (calls/puts EOD)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/33_opciones_snapshot.py
