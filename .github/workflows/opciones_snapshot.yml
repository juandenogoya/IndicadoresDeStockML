name: Opciones Snapshot Diario

on:
  schedule:
    # 3 intentos diarios para resistir rate limiting de yfinance post-cierre.
    # Cada intento verifica si ya hay datos en DB antes de correr.
    # Si los datos existen -> Telegram "ya disponible" -> exit 0 (skip).
    # Si 0 contratos (rate limit) -> Telegram "proximo intento HH:MM" -> exit 0.
    # Solo el intento 3 fallido genera exit 1 (error critico).
    #
    # Intento 1 -- 23:00 UTC L-V  (3hs post-cierre, mismo dia)
    # Intento 2 -- 02:00 UTC Ma-Sa (madrugada, dia siguiente)
    # Intento 3 -- 11:00 UTC Ma-Sa (2.5hs antes apertura, dia siguiente)
    #
    # --fecha: intento 1 usa la fecha del mismo dia;
    #          intentos 2 y 3 usan la fecha de ayer (prev trading day).
    - cron: '0 23 * * 1-5'
    - cron: '0  2 * * 2-6'
    - cron: '0 11 * * 2-6'
  workflow_dispatch:

jobs:
  opciones:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Snapshot opciones -- Intento 1 (23:00 UTC)
        if: github.event.schedule == '0 23 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/33_opciones_snapshot.py --intento 1 --fecha $(date +%Y-%m-%d)

      - name: Snapshot opciones -- Intento 2 (02:00 UTC)
        if: github.event.schedule == '0  2 * * 2-6'
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/33_opciones_snapshot.py --intento 2 --fecha $(date -d 'yesterday' +%Y-%m-%d)

      - name: Snapshot opciones -- Intento 3 (11:00 UTC)
        if: github.event.schedule == '0 11 * * 2-6'
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/33_opciones_snapshot.py --intento 3 --fecha $(date -d 'yesterday' +%Y-%m-%d)

      - name: Notificar fallo en Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>ERROR -- Opciones Snapshot</b>%0AWorkflow fallido (3 intentos sin datos).%0ARevisa: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
