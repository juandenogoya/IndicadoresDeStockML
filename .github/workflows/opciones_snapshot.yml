name: Opciones Snapshot Diario

on:
  schedule:
    # Ma-Sa a las 10:00 UTC (6 AM ET / 7 AM Argentina)
    # Captura EOD del dia anterior (L-V) en ventana pre-apertura.
    # yfinance tiene los datos completos del cierre anterior y el mercado
    # aun no abrio (apertura 13:30 UTC). Con hasta 3h de delay de GH Actions
    # (caso peor: 13:00 UTC = 9 AM ET), seguimos antes de la apertura.
    # EVITA la ventana de mantenimiento de Yahoo (00:00-03:00 AM ET = 04-07 UTC)
    # que devuelve opciones vacias para todos los tickers.
    - cron: '0 10 * * 2-6'
  workflow_dispatch:  # Permite ejecucion manual desde GitHub

jobs:
  opciones:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Snapshot opciones (calls/puts EOD)
        env:
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/33_opciones_snapshot.py --fecha $(date -d 'yesterday' +%Y-%m-%d)
