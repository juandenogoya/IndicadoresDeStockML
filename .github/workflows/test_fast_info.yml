name: TEST fast_info endpoint

# Workflow de prueba para confirmar que yf.Ticker().fast_info
# (endpoint /v8/finance/quote/) funciona desde IPs de GitHub Actions (Azure).
#
# Si este test pasa -> podemos reemplazar yf.download() en el cron diario.
# Si falla con RateLimitError -> el endpoint de cotizaciones tambien esta bloqueado.
#
# ELIMINAR este workflow una vez confirmado el resultado.

on:
  workflow_dispatch:   # solo manual, sin schedule

jobs:
  test_fast_info:
    name: "Test fast_info (dry-run 199 tickers)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Test fast_info dry-run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH:   ${{ github.workspace }}
        run: python scripts/actualizar_precios_fast_info.py --dry-run
