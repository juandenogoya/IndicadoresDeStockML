name: Trading Bot Alpaca

# Corre L-V a las 15:15 UTC = 11:15 ET
# El cron diario (particionado) inicia a las 13:00 UTC.
# El scanner ML (Paso 3) termina ~15:00 UTC.
# Los bots corren con 15 min de margen para garantizar datos del dia.

on:
  schedule:
    - cron: "15 15 * * 1-5"
  workflow_dispatch:          # permite correr manualmente desde GitHub

jobs:
  trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        env:
          # Secrets (sensibles)
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY:        ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:     ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          # Variables (configuracion)
          ALPACA_PAPER:          ${{ vars.ALPACA_PAPER }}
          BOT_MAX_POSICIONES:    ${{ vars.BOT_MAX_POSICIONES }}
          BOT_RIESGO_POR_TRADE:  ${{ vars.BOT_RIESGO_POR_TRADE }}
          BOT_MAX_EXPOSICION:    ${{ vars.BOT_MAX_EXPOSICION }}
          BOT_MODO_DISTRIBUCION: ${{ vars.BOT_MODO_DISTRIBUCION }}
          BOT_SCORE_MIN_COMPRA:  ${{ vars.BOT_SCORE_MIN_COMPRA }}
          BOT_NIVEL_MIN_COMPRA:  ${{ vars.BOT_NIVEL_MIN_COMPRA }}
          BOT_STOP_LOSS_PCT:     ${{ vars.BOT_STOP_LOSS_PCT }}
          BOT_TAKE_PROFIT_PCT:   ${{ vars.BOT_TAKE_PROFIT_PCT }}
        run: python scripts/30_trading_bot.py

      - name: Notificar fallo en Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>ERROR — BOT ML (Alpaca #1)</b>%0AWorkflow fallido en GitHub Actions.%0ARevisa: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
