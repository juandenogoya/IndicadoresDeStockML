name: Trading Bot Velas / Price Action (Alpaca #3)

# Corre L-V a las 14:30 UTC = 10:30 ET (1h despues de apertura NYSE)
# Los 3 bots corren en la misma ventana horaria, en paralelo.

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

jobs:
  trading-bot-candle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run candle trading bot
        env:
          # Secrets
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_3:       ${{ secrets.ALPACA_API_KEY_3 }}
          ALPACA_SECRET_KEY_3:    ${{ secrets.ALPACA_SECRET_KEY_3 }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          # Variables
          ALPACA_PAPER:           ${{ vars.ALPACA_PAPER }}
          BOT_MAX_POSICIONES:     ${{ vars.BOT_MAX_POSICIONES }}
          BOT_RIESGO_POR_TRADE:   ${{ vars.BOT_RIESGO_POR_TRADE }}
          BOT_MAX_EXPOSICION:     ${{ vars.BOT_MAX_EXPOSICION }}
          BOT_STOP_LOSS_PCT:      ${{ vars.BOT_STOP_LOSS_PCT }}
          BOT_TAKE_PROFIT_PCT:    ${{ vars.BOT_TAKE_PROFIT_PCT }}
        run: python scripts/32_bot_candle.py
