name: Trading Bot SMC Estructura (Alpaca #3)

# Corre L-V a las 15:15 UTC = 11:15 ET
# El cron diario (particionado) inicia a las 13:00 UTC.
# El scanner ML (Paso 3) termina ~15:00 UTC.
# Los 3 bots corren en paralelo a las 15:15 UTC con datos del dia.
# Estrategia: CHoCH/BOS alcista + estructura sostenida. Salidas por estructura pura.

on:
  schedule:
    - cron: "15 15 * * 1-5"
  workflow_dispatch:

jobs:
  trading-bot-candle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SMC estructura trading bot
        env:
          # Secrets
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_3:       ${{ secrets.ALPACA_API_KEY_3 }}
          ALPACA_SECRET_KEY_3:    ${{ secrets.ALPACA_SECRET_KEY_3 }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          # Variables
          ALPACA_PAPER:           ${{ vars.ALPACA_PAPER }}
          BOT_MAX_POSICIONES:     ${{ vars.BOT_MAX_POSICIONES }}
          BOT_RIESGO_POR_TRADE:   ${{ vars.BOT_RIESGO_POR_TRADE }}
          BOT_MAX_EXPOSICION:     ${{ vars.BOT_MAX_EXPOSICION }}
          BOT_STOP_LOSS_PCT:      ${{ vars.BOT_STOP_LOSS_PCT }}
          BOT_TAKE_PROFIT_PCT:    ${{ vars.BOT_TAKE_PROFIT_PCT }}
        run: python scripts/alpaca/bot_options.py

      - name: Notificar fallo en Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>ERROR — BOT SMC ESTRUCTURA (Alpaca #3)</b>%0AWorkflow fallido en GitHub Actions.%0ARevisa: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
