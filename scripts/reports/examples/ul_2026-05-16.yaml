# ** para negritas, - para listas. El PDF lo renderiza con estilo navy.
narrativa: |
  ## Análisis de opciones

  Tendencia diaria mixta: PCR vol 0.61 alcista (más actividad en calls),
  pero PCR OI 1.27 bajista (más posicionamiento defensivo). El IV skew
  positivo refuerza el sesgo defensivo.

  La acumulación de OI por vencimiento muestra divergencia: corto plazo
  neutro, medio bajista (puts acumulando en 47-48), largo alcista
  (calls acumulando en 60).

  ## Estructura técnica

  RSI 48 (neutral) y MACD bajista en el muy corto plazo, pero SMA21 sobre
  SMA50 sostiene la estructura alcista de medio plazo. La acción está
  consolidando arriba de 50 con resistencia clara en 51.5-52.

  ## Setup operativo

  - **Largo**: ruptura sostenida arriba de $52 con volumen.
  - **TP1**: $55 (resistencia del medio plazo).
  - **SL**: cierre bajo $48.5 invalida el setup.
  - **Vigilar**: si el PCR OI del medio plazo se modera, el sesgo se vuelve
    más claramente alcista.
