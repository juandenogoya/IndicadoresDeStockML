[pytest]
# pythonpath agrega el repo root a sys.path (equivale a PYTHONPATH=.).
# importmode=importlib evita la colision entre tests/mcp_server/ y el
# paquete fuente mcp_server/: pytest no inserta directorios padre en
# sys.path y usa importlib directamente para resolver modulos.
pythonpath = .
addopts = --import-mode=importlib
testpaths = tests

markers =
    integration: test que requiere conexion a DB real (DATABASE_URL en env)
